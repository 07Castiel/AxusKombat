name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile: falha se package.json e bun.lock divergirem, em vez
      # de resolver versoes novas em silencio. E o que torna o CI reproduzivel.
      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Checagem de tipos
        run: bun run typecheck

      - name: Testes
        run: bun run test

      # O build e o teste mais forte que temos hoje: ele resolve as rotas do
      # TanStack Start e monta o bundle do Worker. Erro de rota so aparece aqui.
      - name: Build
        run: bun run build
